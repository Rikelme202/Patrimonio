<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f3" id="themeColor">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimônio">
<title>Patrimônio</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/" aria-label="Patrimônio, início"><img src="/icon.svg" alt="" width="28" height="28"><span>Patrimônio</span></a>
    <nav id="nav" class="nav" aria-label="Seções" hidden></nav>
    <div class="top-actions">
      <button class="iconbtn" id="themeBtn" aria-label="Mudar para o tema escuro"></button>
      <button class="scanbtn" id="scanTop" aria-label="Ler código de um bem" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M7 9v6M10 9v6M13 9v6M17 9v6"/></svg><span>Ler código</span></button>
      <div id="userbox" class="userbox"></div>
    </div>
  </div>
</header>

<main id="app" class="container"></main>

<button class="fab" id="scanFab" aria-label="Ler código de um bem" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M7 9v6M10 9v6M13 9v6M17 9v6"/></svg></button>
<div id="modal" class="overlay" hidden><div class="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>

<script src="/barcode.js"></script>
<script src="/app.js"></script>
</body>
</html>
